# /etc/nginx/sites-available/ichsanfachri.my.id
# Satu app Next.js melayani dua host:
#   ichsanfachri.my.id        -> website publik
#   admin.ichsanfachri.my.id  -> panel admin (login + upload)

server {
    listen 80;
    server_name ichsanfachri.my.id www.ichsanfachri.my.id admin.ichsanfachri.my.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.ichsanfachri.my.id;
    ssl_certificate     /etc/letsencrypt/live/ichsanfachri.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ichsanfachri.my.id/privkey.pem;
    return 301 https://ichsanfachri.my.id$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ichsanfachri.my.id admin.ichsanfachri.my.id;

    ssl_certificate     /etc/letsencrypt/live/ichsanfachri.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ichsanfachri.my.id/privkey.pem;

    client_max_body_size 25M;   # batas upload (app membatasi 20 MB)

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
