# Dijalankan berdampingan dengan stack lain di VPS yang sama.
# Caddy (milik stack lain) memegang port 80/443 dan meneruskan domain ke service ini
# lewat jaringan Docker bersama "app_default".
# PENTING: nama service sengaja "portfolio", BUKAN "app" — nama "app" sudah dipakai
# stack lain di jaringan yang sama (akan salah rute).
services:
  portfolio:
    build: .
    image: portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    networks:
      - default
      - caddy

networks:
  caddy:
    name: app_default
    external: true
